name: Windows OpenXR CI

on: workflow_dispatch

jobs:
  build-windows:
    name: Build OpenXR (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
    - uses: actions/checkout@v6
    - name: Check out OpenXR SDK 1.1.63
      uses: actions/checkout@v6
      with:
        repository: KhronosGroup/OpenXR-SDK
        ref: f2448a8797c85814aa892efc1ab8707900fbcc78
        path: .openxr-sdk
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.6.0
      with:
        vulkan_version: 1.4.363.0
        install_runtime: false
        cache: true
        stripdown: true
    - name: Build static OpenXR loader
      shell: pwsh
      run: |
        cmake -S .openxr-sdk -B .openxr-sdk/build -G "Visual Studio 18 2026" -A x64 -DDYNAMIC_LOADER=OFF
        if ($LASTEXITCODE -ne 0) { throw 'OpenXR SDK configure failed' }
        cmake --build .openxr-sdk/build --config '${{ matrix.configuration }}' --target openxr_loader --parallel
        if ($LASTEXITCODE -ne 0) { throw 'OpenXR loader build failed' }
    - name: Build vkQuake-OpenXR
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
        if (-not $msbuild) { throw 'MSBuild not found' }
        $sdk = Join-Path $env:GITHUB_WORKSPACE '.openxr-sdk'
        & $msbuild Windows/VisualStudio/vkquake.sln /m '/p:Configuration=${{ matrix.configuration }}' /p:Platform=x64 "/p:OpenXRSDK=$sdk" /v:minimal /nologo
        if ($LASTEXITCODE -ne 0) { throw 'Game build failed' }
    - name: Run OpenXR backend tests
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
        $sdk = Join-Path $env:GITHUB_WORKSPACE '.openxr-sdk'
        & $msbuild tests/openxr_display_test.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:OpenXRSDK=$sdk" /v:minimal /nologo
        if ($LASTEXITCODE -ne 0) { throw 'Backend test build failed' }
        & ./build/tests/openxr_display_test.exe
        if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: vkQuake-OpenXR (${{ matrix.configuration }}, x64)
        if-no-files-found: error
        path: |
          Windows/VisualStudio/Build-vkQuake-OpenXR/x64/${{ matrix.configuration }}/*.exe
          Windows/VisualStudio/Build-vkQuake-OpenXR/x64/${{ matrix.configuration }}/*.dll
          Windows/VisualStudio/Build-vkQuake-OpenXR/x64/${{ matrix.configuration }}/*.pdb
    - name: Package Release
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 8) }
        $source = 'Windows/VisualStudio/Build-vkQuake-OpenXR/x64/Release'
        $package = 'build/vkQuake-OpenXR-Windows-x64'
        New-Item -ItemType Directory -Path $package -Force | Out-Null
        Copy-Item -Path "$source/*.exe", "$source/*.dll", 'readme.md', 'LICENSE.txt', 'LICENSE-OpenXR.txt' -Destination $package
        Compress-Archive -Path "$package/*" -DestinationPath "build/vkQuake-OpenXR-${version}-Windows-x64.zip"
    - name: Upload Release package
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: vkQuake-OpenXR Windows x64 ZIP
        if-no-files-found: error
        path: build/vkQuake-OpenXR-*-Windows-x64.zip
